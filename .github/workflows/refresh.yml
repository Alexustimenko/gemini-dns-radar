name: Refresh Gemini DNS ranking

on:
  schedule:
    # Watchdog wakes up every 10 minutes. It runs a full scan only when
    # the last successful state is older than 50 minutes.
    - cron: "2,12,22,32,42,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gemini-dns-radar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check freshness and Worker API
        id: freshness
        env:
          PUBLISH_URL: ${{ secrets.PUBLISH_URL }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.error
          import urllib.request

          base = os.environ["PUBLISH_URL"].rstrip("/")
          token = os.environ["PUBLISH_TOKEN"]
          event = os.environ.get("GITHUB_EVENT_NAME", "")

          headers = {
              "Authorization": f"Bearer {token}",
              "User-Agent": "GeminiDNSRadar/1.0",
              "Accept": "application/json",
          }

          req = urllib.request.Request(base + "/api/state", headers=headers)

          try:
              with urllib.request.urlopen(req, timeout=25) as response:
                  state = json.loads(response.read().decode("utf-8"))
                  print("Worker API preflight:", response.status)
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              print(f"Worker API preflight failed: HTTP {exc.code}")
              print(body[:2000])
              raise

          # Compatibility cleanup for state written by older crawler versions.
          # In particular, old records may contain last=null, while current code
          # expects last to be an object.
          changed = False
          candidates = state.get("candidates")
          if not isinstance(candidates, dict):
              candidates = {}
              state["candidates"] = candidates
              changed = True

          for host, record in list(candidates.items()):
              if not isinstance(record, dict):
                  candidates[host] = {
                      "host": host,
                      "sources": [],
                      "special_source": False,
                      "history": [],
                      "last": {},
                      "score": 0,
                  }
                  changed = True
                  continue

              if record.get("last") is None:
                  record["last"] = {}
                  changed = True
              if record.get("history") is None:
                  record["history"] = []
                  changed = True
              if record.get("sources") is None:
                  record["sources"] = []
                  changed = True

          if changed:
              payload = json.dumps(state, ensure_ascii=False).encode("utf-8")
              publish_headers = dict(headers)
              publish_headers["Content-Type"] = "application/json"
              publish_req = urllib.request.Request(
                  base + "/api/publish",
                  data=payload,
                  method="POST",
                  headers=publish_headers,
              )
              with urllib.request.urlopen(publish_req, timeout=25) as response:
                  print("Legacy state normalized:", response.status)
                  print(response.read().decode("utf-8", errors="replace")[:1000])

          updated_at = state.get("updated_at")
          should_run = event == "workflow_dispatch"

          if should_run:
              reason = "manual dispatch always forces a scan"
          elif not updated_at:
              should_run = True
              reason = "no previous successful update"
          else:
              updated = dt.datetime.fromisoformat(updated_at.replace("Z", "+00:00"))
              now = dt.datetime.now(dt.timezone.utc)
              age_minutes = (now - updated).total_seconds() / 60
              should_run = age_minutes >= 50
              reason = f"state age is {age_minutes:.1f} minutes"

          print("Last successful update:", updated_at or "none")
          print("Decision:", "RUN" if should_run else "SKIP", "-", reason)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"run={'true' if should_run else 'false'}\n")
          PY

      - name: Run Outage Radar
        if: steps.freshness.outputs.run == 'true'
        env:
          PUBLISH_URL: ${{ secrets.PUBLISH_URL }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          SCAN_LIMIT: "90"
          EMERGENCY_SCAN_LIMIT: "320"
          MAX_WORKERS: "14"
          DNS_TIMEOUT: "4.0"
        run: python crawler/radar.py

      - name: Fresh data - scan not needed
        if: steps.freshness.outputs.run != 'true'
        run: echo "Radar data is still fresh; watchdog check completed successfully."
