name: Refresh Gemini DNS ranking

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check Worker API
        env:
          PUBLISH_URL: ${{ secrets.PUBLISH_URL }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request

          url = os.environ["PUBLISH_URL"].rstrip("/") + "/api/state"
          token = os.environ["PUBLISH_TOKEN"]
          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "User-Agent": "GeminiDNSRadar/1.0",
                  "Accept": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=25) as response:
                  print("Worker API preflight:", response.status)
                  print(response.read().decode("utf-8", errors="replace")[:1000])
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              print(f"Worker API preflight failed: HTTP {exc.code}")
              print(body[:2000])
              raise
          PY

      - name: Run Outage Radar
        env:
          PUBLISH_URL: ${{ secrets.PUBLISH_URL }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          SCAN_LIMIT: "90"
          EMERGENCY_SCAN_LIMIT: "320"
          MAX_WORKERS: "14"
          DNS_TIMEOUT: "4.0"
        run: python crawler/radar.py
